name: Socket iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "SocketApp/**"
      - ".github/workflows/socket-app.yml"
      - "Bridge/KeystoneBridge/Extras.h"
      - "Bridge/KeystoneBridge/Control.h"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          brew install xcodegen
      - name: Verify installed version UI contract
        run: |
          grep -q 'CFBundleShortVersionString' SocketApp/Sources/SocketApp.swift
          grep -q 'CFBundleVersion' SocketApp/Sources/SocketApp.swift
      - name: Build
        working-directory: SocketApp
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Socket.xcodeproj -scheme Socket -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER build | tee build.log
          test -d build/Build/Products/Release-iphoneos/Socket.app
      - name: Package IPA and factual release notes
        working-directory: SocketApp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Socket.app Payload/
          BUILD=$GITHUB_RUN_NUMBER
          VERSION="1.0.$BUILD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Payload/Socket.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Payload/Socket.app/Info.plist
          codesign --force --sign - --timestamp=none Payload/Socket.app
          IPA="Socket-$VERSION-build-$BUILD.ipa"
          zip -qr "$IPA" Payload
          echo "## Socket $VERSION" > release-notes.md
          echo "Standalone iPhone app for Keystone's power-strip controller." >> release-notes.md
          echo "### Actual code changes" >> release-notes.md
          PREV=$(git tag -l 'socket-build-*' --sort=-v:refname | head -1 || true)
          if [ -n "$PREV" ]; then
            git log --no-merges --format='- %h %s' "$PREV"..HEAD -- SocketApp Bridge/KeystoneBridge/Control.h Bridge/KeystoneBridge/Extras.h >> release-notes.md
            git diff --name-only "$PREV"..HEAD -- SocketApp Bridge/KeystoneBridge/Control.h Bridge/KeystoneBridge/Extras.h | sed 's/^/- File: /' >> release-notes.md
          else
            echo "- First app release: bridge pairing, live switches, two Shortcuts actions, and scoped token authorization." >> release-notes.md
          fi
          echo "Hardware protocol and HomeKit USB mappings require real-device verification. Local Wi-Fi is needed for app Shortcuts." >> release-notes.md
      - name: Publish separate Socket release (not Keystone firmware latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: socket-build-${{ github.run_number }}
          name: Socket build ${{ github.run_number }}
          body_path: SocketApp/release-notes.md
          files: SocketApp/Socket-*.ipa
          make_latest: false

      - name: Update existing Keystone FlareStore source with Socket IPA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          IPA=$(find SocketApp -maxdepth 1 -name 'Socket-*.ipa' -print -quit)
          test -s "$IPA"
          TAG="socket-build-$GITHUB_RUN_NUMBER"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$IPA")"
          success=0
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/socket-source"
            git fetch -q origin source
            git worktree add -q -f --detach "$RUNNER_TEMP/socket-source" FETCH_HEAD
            python3 .github/scripts/update-socket-source.py \
              "$RUNNER_TEMP/socket-source/source.json" "$IPA" "$URL" SocketApp/release-notes.md
            git -C "$RUNNER_TEMP/socket-source" add source.json
            if git -C "$RUNNER_TEMP/socket-source" diff --cached --quiet; then
              success=1
              break
            fi
            git -C "$RUNNER_TEMP/socket-source" commit -qm "FlareStore: Socket build $GITHUB_RUN_NUMBER"
            if git -C "$RUNNER_TEMP/socket-source" push -q origin HEAD:refs/heads/source; then
              success=1
              break
            fi
            git worktree remove -f "$RUNNER_TEMP/socket-source" || true
            sleep 3
          done
          test "$success" -eq 1
