name: Keystone
options:
  bundleIdPrefix: com.soum91
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Keystone:
    type: application
    platform: iOS
    sources:
      - path: Keystone
      - path: Shared
    dependencies:
      - target: KeystoneWidget
    info:
      path: Keystone/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Keystone
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Keystone talks to your home bridge over Wi-Fi to show its status and change its settings.
        NSBonjourServices: [_afterglow._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.soum91.keystone
            CFBundleURLSchemes: [keystone]
    entitlements:
      path: Keystone/Keystone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.keystone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.keystone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  KeystoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: KeystoneWidget
      - path: Shared
    info:
      path: KeystoneWidget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Keystone
        NSLocalNetworkUsageDescription: Keystone's widget reads the room temperature from your home bridge.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KeystoneWidget/KeystoneWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.soum91.keystone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soum91.keystone.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
